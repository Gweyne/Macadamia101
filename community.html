<style>
    :root{
      /* 🍯 Macadamia Cream Theme — warm, organic tones */
      --bg: #faf6f1;        /* soft creamy white background */
      --surface: #f5ede3;   /* warm off-white for cards/nav/footer */
      --text: #2f2a24;      /* dark brown-gray for comfortable reading */
      --muted: #7a6f63;     /* warm taupe-gray for subtitles and metadata */
      --accent: #5f8a72;    /* earthy green for buttons, highlights */
      --accent-2: #b9916a;  /* nutty brown secondary accent */
      --line: #e0d7cc;      /* light beige border lines */
      --shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
      --radius: 16px;
      --maxw: 800px;
      --font-sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --h1: clamp(2rem, 3vw + 1rem, 3rem);
      --h2: clamp(1.375rem, 1.2vw + 1rem, 1.75rem);
      --body: 1.05rem;
      --lh: 1.75;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg: #0b0f0d;
        --text: #e5e7eb;
        --muted: #9aa3af;
        --accent: #71c39a;
        --accent-2: #d8b8a0;
        --surface: #101513;
        --line: #1f2a24;
        --shadow: 0 10px 24px rgba(0,0,0,.45);
      }
    }
    body{
      margin:0; padding:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--font-sans);
      font-size: var(--body);
      line-height: var(--lh);
    }
    .container{ max-width: 1200px; margin-inline:auto; padding: clamp(16px,3vw,40px); }
    .post{ max-width: var(--maxw); margin-inline:auto; }
    .post-header{ margin-bottom:1.5rem; }
    .post-title{ font-size: var(--h1); line-height:1.15; font-weight:800; margin:0 0 .5rem 0; }
    .post-subtitle{ color:var(--muted); font-size:1rem; margin:0 0 .5rem 0; }
    .post-meta{ display:flex; gap:.75rem; flex-wrap:wrap; color:var(--muted); font-size:.95rem; }
    .badge{ display:inline-flex; align-items:center; gap:.5ch; padding:.35rem .6rem; font-size:.85rem; border-radius:999px; background: color-mix(in oklab, var(--accent) 12%, transparent); color: color-mix(in oklab, var(--accent) 40%, var(--text)); border:1px solid color-mix(in oklab, var(--accent) 30%, var(--line)); }
    .post h2{ font-size: var(--h2); margin:2.2rem 0 .75rem; font-weight:750; padding-bottom:.4rem; border-bottom:2px solid color-mix(in oklab, var(--accent) 30%, transparent); }
    .post p{ margin:0 0 1.05rem 0; }
    .post hr{ border:0; height:1px; background:var(--line); margin:2rem 0; }
    .callout{ background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 8%, transparent), transparent 65%); border:1px solid color-mix(in oklab, var(--accent) 25%, var(--line)); border-left:4px solid var(--accent); padding:1rem 1.1rem; border-radius:var(--radius); margin:1.25rem 0; }
    .author{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:1rem; margin:2rem 0 0; box-shadow: var(--shadow); }
    .author h4{ margin:0 0 .25rem 0; font-size:1.05rem; font-weight:800; }
    .author p{ margin:0; color:var(--muted); }
    .cta{ margin-top:2rem; padding:1.25rem; border-radius:var(--radius); background: linear-gradient(180deg, color-mix(in oklab, var(--accent-2) 12%, transparent), transparent 65%); border:1px solid color-mix(in oklab, var(--accent-2) 30%, var(--line)); }

    /* 🔹 Image size control */
    .post img{
      max-width:600px;   /* limit to 600px */
      width:100%;        /* responsive on small screens */
      display:block;     /* so margin auto works */
      margin:1rem auto;  /* center images */
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    /* Navbar */
    nav{
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .nav-container{
      max-width:1200px;
      margin:0 auto;
      padding:.75rem 1rem;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .nav-brand{ font-weight:800; font-size:1.2rem; color:var(--accent); text-decoration:none; }
    .nav-links{ display:flex; gap:1rem; }
    .nav-links a{ text-decoration:none; color:var(--text); font-weight:500; transition:.2s; }
    .nav-links a:hover{ color:var(--accent); }

    /* Footer */
    footer{
      background: var(--surface);
      border-top: 1px solid var(--line);
      margin-top:3rem;
      padding:1.25rem;
      text-align:center;
      color:var(--muted);
      font-size:.9rem;
    }
    footer a{ color:var(--accent); text-decoration:none; }
    footer a:hover{ text-decoration:underline; }
